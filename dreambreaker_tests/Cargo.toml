[package]
name = "dreambreaker_tests"
version = "0.1.0"
edition = "2021"
doctest = false

[dependencies]
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }
dotenvy = "0.15"
bcrypt = "0.15"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
