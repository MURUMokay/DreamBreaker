[package]
name = "dreambreaker"
version = "0.1.0"
edition = "2021"
description = "DreamBreaker — десктоп-приложение на Rust с использованием Iced"
license = "MIT"

[[bin]]
name = "dreambreaker"
path = "src/main.rs"

[dependencies]
# GUI framework
iced = { version = "0.13", features = ["tokio", "svg"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Database: sqlx with PostgreSQL
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }

# UUID support
uuid = { version = "1", features = ["v4", "serde"] }

# Environment variables
dotenvy = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dates
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Security & Randomness
bcrypt = "0.15"
rand = "0.8"